name: PA800 release matrix

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  release-validation:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked validation dependencies
        run: python -m pip install -r requirements-validation.txt -c constraints-validation.txt
      - name: Clean install smoke
        run: python tools/clean_install_smoke.py
      - name: Complete stress
        run: python tools/run_complete_stress.py